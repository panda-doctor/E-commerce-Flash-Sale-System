# =====================================================
# 轻量级电商秒杀系统 - 应用配置
# =====================================================

server:
  port: 8081                      # 【新增】指定启动端口为 8081

# Stream 自动消费开关：浏览器演示 / JMeter 压测需要消费者自动异步建单时开启
# 集成测试侧已在 @SpringBootTest(properties = "flash.stream.auto-poll=false") 中显式关闭，
# 避免后台轮询与用例手动驱动消费 / 失败重试断言产生竞态。
flash:
  stream:
    auto-poll: true

# =====================================================
# 图片存储双策略：local（默认，本地磁盘 + /uploads 静态映射）| oss（阿里云 OSS）
# OSS 的 AccessKey 按需求硬编码在 OssImageStorageService 类内（占位，部署前替换）
# =====================================================
storage:
  type: local
  local:
    dir: uploads

spring:
  application:
    name: E-commerceFlashSaleSystem
  servlet:
    multipart:
      max-file-size: 6MB          # 上传图片大小上限（服务内校验 5MB，预留 multipart 余量）
      max-request-size: 8MB

  # =====================================================
  # MySQL 数据源
  # =====================================================
  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 1800000
    driver-class-name: com.mysql.cj.jdbc.Driver

  # =====================================================
  # Redis 配置
  # =====================================================
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms

# =====================================================
# MyBatis-Plus 配置
# =====================================================
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ghb.ecommerceflashsalesystem.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: INPUT

# =====================================================
# 日志配置
# =====================================================
logging:
  level:
    com.ghb.ecommerceflashsalesystem: DEBUG
    org.springframework.data.redis: INFO
    org.mybatis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

