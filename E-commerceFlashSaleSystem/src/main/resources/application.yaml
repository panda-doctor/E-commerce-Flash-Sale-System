# =====================================================
# 轻量级电商秒杀系统 - 应用配置
# =====================================================

server:
  port: 8081                      # 【新增】指定启动端口为 8081

# Stream 自动消费开关：浏览器演示 / JMeter 压测需要消费者自动异步建单时开启
# 集成测试侧已在 @SpringBootTest(properties = "flash.stream.auto-poll=false") 中显式关闭，
# 避免后台轮询与用例手动驱动消费 / 失败重试断言产生竞态。
flash:
  stream:
    auto-poll: true

# =====================================================
# 阿里云 OSS 图片存储（商品主图上传）
# aliyun.oss.enabled=true（默认）→ 上传写入 OSS bucket（panda-tea，北京地域），
#   URL = {domain}/uploads/{yyyyMM}/uuid.ext；域名可换自定义 CDN 域名。
# aliyun.oss.enabled=false  → 走本地磁盘（storage.local.dir + /uploads 静态映射）。
# 密钥务必用环境变量注入 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET，勿提交进 Git。
# 完整接入与切换见 docs/storage.md。
# =====================================================
aliyun:
  oss:
    enabled: ${OSS_ENABLED:true}
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:panda-tea}
    domain: ${OSS_DOMAIN:https://panda-tea.oss-cn-beijing.aliyuncs.com}

# 本地磁盘兜底目录（enabled=false 时使用）
storage:
  local:
    dir: uploads

# =====================================================
# AI 客服大模型（OpenAI Chat Completions 兼容协议，默认 DeepSeek）
# ⚠ 密钥为本地演示默认值：切勿随 application.yaml 提交进 Git；上线前改为环境变量
#   AI_LLM_API_KEY 注入并轮换该 Key（或改用阿里云百炼等其它兼容服务）。
# base-url 可带 /v1 亦可省略（客户端自动拼接 /chat/completions）。
# api-key 留空时 /api/support/chat 返回 50300 可读提示。
# =====================================================
ai:
  llm:
    base-url: ${AI_LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_LLM_API_KEY:sk-f0a743f6f4184ec28672d0daa9727107}
    model: ${AI_LLM_MODEL:deepseek-chat}   # deepseek-v4-flash 对复杂目录场景偶发空回复，演示用官方 deepseek-chat 更稳
    temperature: 0.7
    max-tokens: 800
    timeout-seconds: 30

spring:
  application:
    name: E-commerceFlashSaleSystem
  servlet:
    multipart:
      max-file-size: 6MB          # 上传图片大小上限（服务内校验 5MB，预留 multipart 余量）
      max-request-size: 8MB

  # =====================================================
  # MySQL 数据源
  # =====================================================
  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 1800000
    driver-class-name: com.mysql.cj.jdbc.Driver

  # =====================================================
  # Redis 配置
  # =====================================================
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms

# =====================================================
# MyBatis-Plus 配置
# =====================================================
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ghb.ecommerceflashsalesystem.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: INPUT

# =====================================================
# 日志配置
# =====================================================
logging:
  level:
    com.ghb.ecommerceflashsalesystem: WARN
    org.springframework.data.redis: INFO
    org.mybatis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

