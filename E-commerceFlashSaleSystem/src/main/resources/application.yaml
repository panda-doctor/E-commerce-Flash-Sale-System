# =====================================================
# 轻量级电商秒杀系统 - 应用配置
# =====================================================

spring:
  application:
    name: E-commerceFlashSaleSystem

  # =====================================================
  # MySQL 数据源
  # =====================================================
  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 1800000
    driver-class-name: com.mysql.cj.jdbc.Driver

  # =====================================================
  # Redis 配置
  # =====================================================
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms

# =====================================================
# MyBatis-Plus 配置
# =====================================================
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ghb.ecommerceflashsalesystem.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: INPUT

# =====================================================
# 日志配置
# =====================================================
logging:
  level:
    com.ghb.ecommerceflashsalesystem: DEBUG
    org.springframework.data.redis: INFO
    org.mybatis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
