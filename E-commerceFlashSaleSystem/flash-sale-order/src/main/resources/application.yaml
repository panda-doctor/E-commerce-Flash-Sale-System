# =====================================================
# 订单服务（flash-sale-order）—— P4 Day 3：order 域服务化
# 端口 8087；服务名 flash-sale-order
# 数据源：**旧库 flash_sale**（order 的三张表尚未拆 schema；auth 用户表也只在那里）
# =====================================================
server:
  port: ${ORDER_PORT:8087}

spring:
  application:
    name: flash-sale-order
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    # P4 Day 4「库拆分」：order 自己的 schema 是**权威源**（读 + 写都在这）；旧库 flash_sale 降级为副本，
    # 由 OrderMirror 反向镜像保鲜 —— 副本的读者是**单体侧 analytics**（OrderQueryAdapter 给榜单/指标补订单号）。
    # 回滚 = 把本行换回 flash_sale + 关镜像（1 分钟，数据无代价）。
    # 键名用 jdbc-url：主数据源由 order.config.AuthDataSourceConfig 显式声明（双数据源），
    # HikariDataSource 只有 setJdbcUrl，写 url 会静默绑不上。
    jdbc-url: jdbc:mysql://localhost:3306/flash_sale_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    maximum-pool-size: 8
    minimum-idle: 2
    connection-timeout: 10000
    max-lifetime: 1800000
  data:
    # 必须与单体同一个 Redis 库：订单 Stream、消费组/PEL、实时榜 ZSet 都在 database=1
    # （榜单读端在单体，写端在本应用 —— 不同库就静默不更新）
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 5000ms

# ===== 安全：与单体一字不差的一段 —— auth-core 的 SecurityProperties 要用 =====
security:
  admin-token: ${ADMIN_TOKEN:}
  user-tokens: ${USER_TOKENS:}
  legacy-user-tokens-enabled: ${LEGACY_USER_TOKENS_ENABLED:false}
  session-cookie-name: ${SESSION_COOKIE_NAME:FLASH_SESSION}
  session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
  session-ttl-hours: ${SESSION_TTL_HOURS:168}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

module:
  # P4 Day 4：权威 = 本应用 datasource（flash_sale_order）；**副本 = 旧库 flash_sale**。
  # 本应用是副本的唯一维护者 → **默认开启**（关掉 = 单体侧 analytics 读到凝固的副本，
  # 对账脚本的 order.* 检查会立刻报 DIFF）。单体/ai 不配这一段（它们没有 order 写路径）。
  db:
    dual-write:
      enabled: ${DUAL_WRITE_ENABLED:true}
      legacy-order-url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: ${MYSQL_PASSWORD:123456}
  # auth 域**尚未服务化**：user_account / user_session 两张表只在旧库 flash_sale，
  # 而本应用的权威数据源是 flash_sale_order → auth 的 4 个 mapper 单开这条通道
  # （装配见 order.config.AuthDataSourceConfig；auth 域服务化后整段删除）
  auth-db:
    jdbc-url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    maximum-pool-size: 4

flash:
  stream:
    # 消费调度开关：本应用是**唯一**开启它的进程（单体已置 false 且其 classpath 上已无调度器）。
    # 消费频率见 StreamConsumerScheduler：新消息 150ms、PEL 重试 5s。
    auto-poll: ${FLASH_STREAM_AUTO_POLL:true}

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml      # XML 在 order-core jar 里，必须 classpath*
  type-aliases-package: com.ghb.ecommerceflashsalesystem.domain.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: INPUT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ghb.ecommerceflashsalesystem: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
