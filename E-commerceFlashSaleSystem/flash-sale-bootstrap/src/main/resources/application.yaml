# =====================================================
# 轻量级电商秒杀系统 - 应用配置
# =====================================================

server:
  port: 8081
  # 由 Spring 处理反向代理传入的 Forwarded / X-Forwarded-* 请求头，
  # 使本地存储上传后返回的 URL 使用对外协议、主机和端口。
  # 生产代理必须覆盖并清除客户端伪造的同名请求头。
  forward-headers-strategy: framework

# 访问控制：生产环境必须通过环境变量提供随机令牌，空值会拒绝受保护请求。
# USER_TOKENS 格式：用户令牌:用户ID，多个条目用逗号分隔；示例 user-token-a:1001,user-token-b:1002。
security:
  admin-token: ${ADMIN_TOKEN:}
  user-tokens: ${USER_TOKENS:}
  legacy-user-tokens-enabled: ${LEGACY_USER_TOKENS_ENABLED:false}
  session-cookie-name: ${SESSION_COOKIE_NAME:FLASH_SESSION}
  session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
  session-ttl-hours: ${SESSION_TTL_HOURS:168}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Stream 自动消费开关：浏览器演示 / JMeter 压测需要消费者自动异步建单时开启
# 集成测试侧已在 @SpringBootTest(properties = "flash.stream.auto-poll=false") 中显式关闭，
# 避免后台轮询与用例手动驱动消费 / 失败重试断言产生竞态。
flash:
  stream:
    # P4 Day 3：消费调度**已随 order 域迁到 flash-sale-order 应用（:8087）** —— 单体这里置 false 是双保险：
    # ① 调度器类（order.scheduler.StreamConsumerScheduler）已不在单体 classpath 上；
    # ② 即使将来有人把它挪回来，本开关也挡住"自动消费"。
    # 重复消费 = 重复建单，这是 order 服务化当天唯一的高危点。
    # 集成测试仍按既有约定自行驱动消费（SeckillOrderConsumer 本体留在 order-core，测试注入它）。
    auto-poll: false
  # 秒杀 execute 防刷限流（滑动窗口，粒度 rate:limit:{activityId}:{userId}）
  # 运行期可用环境变量 FLASH_RATE_LIMIT_WINDOW_SECONDS / FLASH_RATE_LIMIT_MAX_COUNT 覆盖；
  # 默认值须与 CacheKeyConstant.RATE_LIMIT_WINDOW_SECONDS / RATE_LIMIT_MAX_COUNT 保持一致。
  rate-limit:
    window-seconds: 60
    max-count: 5

# =====================================================
# 阿里云 OSS 图片存储（商品主图上传）
# aliyun.oss.enabled=true → 上传写入 OSS bucket（panda-tea，北京地域），
#   URL = {domain}/uploads/{yyyyMM}/uuid.ext；域名可换自定义 CDN 域名。
# aliyun.oss.enabled=false（默认）→ 走本地磁盘（storage.local.dir + /uploads 静态映射）。
# 密钥务必用环境变量注入 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET，勿提交进 Git。
# 完整接入与切换见 docs/storage.md。
# =====================================================
aliyun:
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:panda-tea}
    domain: ${OSS_DOMAIN:https://panda-tea.oss-cn-beijing.aliyuncs.com}

# 本地磁盘兜底目录（enabled=false 时使用）
storage:
  local:
    dir: uploads

module:
  # 内部接口令牌（P3 Day 5）：服务间调用（activity → 单体 seckill 库存接口）使用；
  # 未配置时 /internal/** 一律拒绝（fail-closed）。dev 默认值仅供本地；生产必须用环境变量覆盖。
  # P4 Day 8：本应用（单体）不是订单数据的属主 → rank/metrics 的订单数据改调 order 服务
  # （analytics.adapter.HttpOrderQueryAdapter），不再直读旧库 flash_sale 的 order 副本。
  # order 应用**不配**这一项（默认 local：查自己的权威库 flash_sale_order）。
  analytics:
    order-query: remote
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}
# P4 Day 1「切读」：单体**不再配置镜像** —— 它对 product / seckill_activity 两表可达到的跨域写为 0
# （P3 Day 5 已收口）；而且它自己就是旧库的读者：副本的新鲜度由两个应用的反向镜像维护。
# DualWriteProperties.enabled 类内默认 false，故此处留白即"关闭"。

# =====================================================
# AI 客服大模型（OpenAI Chat Completions 兼容协议，默认 DeepSeek）
# ⚠ 密钥为本地演示默认值：切勿随 application.yaml 提交进 Git；上线前改为环境变量
#   AI_LLM_API_KEY 注入并轮换该 Key（或改用阿里云百炼等其它兼容服务）。
# base-url 可带 /v1 亦可省略（客户端自动拼接 /chat/completions）。
# api-key 留空时 /api/support/chat 返回 50300 可读提示。
# =====================================================
ai:
  llm:
    base-url: ${AI_LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_LLM_API_KEY:}
    model: ${AI_LLM_MODEL:deepseek-chat}   # deepseek-v4-flash 对复杂目录场景偶发空回复，演示用官方 deepseek-chat 更稳
    temperature: 0.7
    max-tokens: 800
    timeout-seconds: 30

spring:
  application:
    # P1-2：服务名改为 flash-sale-monolith —— T4 网关将以 lb://flash-sale-monolith 做服务发现路由
    name: flash-sale-monolith

  # =====================================================
  # P1-2 服务注册（Nacos）
  # 本机 Nacos 2.5.4 standalone、未开鉴权；端口 8848（HTTP）+ 9848（客户端 gRPC，必须通）
  # 测试侧由 src/test/resources/application.properties 关闭注册（Nacos 未启动时不拖慢/报错）
  # =====================================================
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

  servlet:
    multipart:
      max-file-size: 6MB          # 上传图片大小上限（服务内校验 5MB，预留 multipart 余量）
      max-request-size: 8MB

  # =====================================================
  # MySQL 数据源
  # =====================================================
  # P4 Day 10 · Step C：单体生产已无任何 mapper/DB 需求（快照写走 ObjectProvider、订单读走
  # order 服务、会话校验走 auth 服务、库存走 Redis）→ **按属性排除数据源自动配置**。
  # 为什么用属性而不是 @SpringBootApplication(exclude=…)：类级 exclude 编译进 classpath，
  # 测试**无法撤销**（上一轮正是这么红掉的）；属性可被测试 properties 以空值覆盖 → 测试照旧有库。
  # 下列 datasource 配置随之成为**惰性配置**（没有任何自动配置消费它），待旧库 DROP 后删除。
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}   # 默认仅供本地演示；真实口令经 .env 的 MYSQL_PASSWORD 注入，勿明文入库
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 1800000
    driver-class-name: com.mysql.cj.jdbc.Driver

  # =====================================================
  # Redis 配置
  # =====================================================
  data:
    redis:
      host: localhost
      port: 6379
      # S2 加固：本机演示默认无密码；共享/云端部署务必用 REDIS_PASSWORD 注入随机强密码，
      # 并只监听内网/回环地址，切勿把 6379 暴露公网（配合缓存序列化白名单形成纵深防御）。
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms

# =====================================================
# MyBatis-Plus 配置
# =====================================================
mybatis-plus:
  # 多模块后 XML 分散在各模块 jar，必须用 classpath* 通配扫描
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.ghb.ecommerceflashsalesystem.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: INPUT

# =====================================================
# P1 可观测：Actuator 健康与指标（Prometheus 抓取 /actuator/prometheus）
# =====================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# =====================================================
# 日志配置
# =====================================================
logging:
  level:
    # P1：调回 INFO —— traceId 贯通与缓存命中观测需要业务日志可见（生产可再按需收紧）
    com.ghb.ecommerceflashsalesystem: INFO
    org.springframework.data.redis: INFO
    org.mybatis: INFO
  pattern:
    # 日志携带 traceId（网关生成 / 过滤器写入 MDC；消费端从消息体恢复）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
