# =====================================================
# P1-2：测试侧关闭 Nacos 服务注册
# =====================================================
# 为什么用 properties 而不是 application.yaml：
#   Spring Boot 测试资源目录下的同名 application.yaml 会「顶掉」主配置（同名文件优先取测试类路径那份），
#   导致测试缺少 datasource/redis 等全部配置；properties 与 yaml 属于不同文件，会并存生效，
#   因此这里只覆盖需要关闭注册的这一个开关。
spring.cloud.nacos.discovery.enabled=false

# =====================================================
# P4 Day 5：测试数据源隔离 —— 集成测试一律打独立测试库
# =====================================================
# 为什么：消费类测试会扫真实 Redis Stream 并把结果写库；若直连业务库，权威切换后
# 会在旧库（order 副本）留下"影子行"，让对账门禁假红（Day 4 收尾实测 23 行）。
# 测试库由 scripts/create-test-db.ps1 建快照（幂等，可重复执行刷新）。
# 只覆盖 url：用户名/口令与主配置一致（root / ${MYSQL_PASSWORD}）。
spring.datasource.url=jdbc:mysql://localhost:3306/flash_sale_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
# P4 收官清理：主配置（生产单体）的 datasource 段已随旧库下线整段删除 →
# 用户名/口令不再有"主配置兜底"，必须在测试侧显式声明（此前只覆盖 url，靠继承）。
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:123456}

# =====================================================
# P4 Day 8：订单读路径在测试上下文里走**本地实现**
# =====================================================
# 主配置（生产单体）是 module.analytics.order-query=remote —— rank/metrics 调 order 服务的内部接口。
# 但测试是**单进程**上下文：没有 order 服务在跑，HTTP 适配器会 fail-closed，把
# SeckillMetricsTest / SeckillRankTest 一并打红（实测 10 个 error）。
# 测试库 flash_sale_test 里有 order 两张表（快照来自业务库），所以测试里用本地实现是等价口径。
# 代价（诚实记录）：跨进程那条分支**不被集成测试覆盖**，由运行时反证承担
# （停 :8087 → metrics 报「订单查询服务不可用：I/O error on GET .../internal/orders/...」）。
module.analytics.order-query=local

# =====================================================
# P4 Day 10 · Step C：测试上下文**恢复数据源**
# =====================================================
# 主配置（生产单体）用 spring.autoconfigure.exclude 排除了 DataSourceAutoConfiguration
# （单体不连任何库）。但测试是"全域装配沙盘"：约十个集成测试要跑域 Bean + mapper（见
# analytics/TestDomainContextConfig），没有数据源它们无法装配。
# 这里置空即可**撤销**主配置的排除 —— 这正是选用"属性化排除"而不是类级 @SpringBootApplication
# (exclude=…) 的原因：classpath 里的注解测试撤销不了（上一轮红掉的主因）。
spring.autoconfigure.exclude=

# =====================================================
# P4 Day 9：Redis 隔离 —— 测试落**逻辑库 db 2**，业务 db 1 零扰动
# =====================================================
# 为什么：业务 Redis 是 database=1（订单 Stream seckill:order:stream、死信、消费组/PEL、
# 实时榜 ZSet 全在同一库，order 应用必须同库才能协作）。测试此前也连 db 1 —— 会把自造消息
# 投进**业务 Stream** 再消费，风险两层：① 业务库里出现测试键/测试消息；② 若 order 应用恰好在跑，
# 它的消费者会**抢走**测试消息（用例挂起/抖动）。Day 5 隔离了 MySQL（flash_sale_test），
# 本日把 Redis 也隔离掉 —— 检查表的最后一项。
#
# 为什么不用 Testcontainers：本机没有 Docker 依赖，而逻辑库隔离是**一行成本达到同一目的**
# （Stream / 消费组 / PEL / 库存键 / 榜单全部随之搬进 db 2）。
# 注意 Boot 3 只认 spring.data.redis.*（spring.redis.* 已被移除）。
spring.data.redis.database=2
