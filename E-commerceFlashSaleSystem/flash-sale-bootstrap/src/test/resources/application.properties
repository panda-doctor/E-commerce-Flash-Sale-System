# =====================================================
# P1-2：测试侧关闭 Nacos 服务注册
# =====================================================
# 为什么用 properties 而不是 application.yaml：
#   Spring Boot 测试资源目录下的同名 application.yaml 会「顶掉」主配置（同名文件优先取测试类路径那份），
#   导致测试缺少 datasource/redis 等全部配置；properties 与 yaml 属于不同文件，会并存生效，
#   因此这里只覆盖需要关闭注册的这一个开关。
spring.cloud.nacos.discovery.enabled=false

# =====================================================
# P4 Day 5：测试数据源隔离 —— 集成测试一律打独立测试库
# =====================================================
# 为什么：消费类测试会扫真实 Redis Stream 并把结果写库；若直连业务库，权威切换后
# 会在旧库（order 副本）留下"影子行"，让对账门禁假红（Day 4 收尾实测 23 行）。
# 测试库由 scripts/create-test-db.ps1 建快照（幂等，可重复执行刷新）。
# 只覆盖 url：用户名/口令与主配置一致（root / ${MYSQL_PASSWORD}）。
spring.datasource.url=jdbc:mysql://localhost:3306/flash_sale_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
