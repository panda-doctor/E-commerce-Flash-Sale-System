# =====================================================
# API 网关（P1-1：静态路由 + traceId 注入 + CORS）
# P1-2 接入 Nacos 后：路由改为 lb://flash-sale-monolith 服务发现
# =====================================================
server:
  # 默认 8090：本机 8080 已被其它服务占用（uvicorn / WSL 端口转发），
  # 可用环境变量 GATEWAY_PORT 覆盖（网关端口变更时记得同步前端 vite 代理）。
  port: ${GATEWAY_PORT:8090}

spring:
  application:
    name: flash-sale-gateway
  cloud:
    # P1-2：服务发现（网关自身也注册进 Nacos，便于控制台统一查看）
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        # P2 Day 2：auth 域已拆为独立服务 flash-sale-auth（:8082）；
        # 精确路由必须排在 /api/** 兜底之前 —— Gateway 按 routes 列表顺序匹配，先匹配先赢。
        - id: flash-sale-auth
          uri: lb://flash-sale-auth
          predicates:
            - Path=/api/auth/**,/api/admin/users/**
        # P2 Day 3：ai 域已服务化（flash-sale-ai :8083）
        - id: flash-sale-ai
          uri: lb://flash-sale-ai
          predicates:
            - Path=/api/support/**
        # P3 Day 2：product 域已服务化（flash-sale-product :8084）。
        # 必须排在 monolith 的 /api/** 兜底之前 —— Gateway 按 routes 列表顺序匹配，先匹配先赢。
        - id: flash-sale-product
          uri: lb://flash-sale-product
          predicates:
            # /uploads/** 不在 /api/** 下，必须单列 —— 静态图片的读取出口（FileStorageWebConfig 已随域迁入本服务）
            - Path=/api/products/**,/api/admin/products/**,/api/admin/files/**,/uploads/**
        # P3 Day 4：activity 域已服务化（flash-sale-activity :8085）。
        # 只能列 activity 自己的三条管理端路径：同前缀下还有 analytics 的
        # /api/admin/seckill/activities/{id}/metrics、/{id}/snapshot 与 order 的
        # /api/admin/seckill/dead-letters/replay —— 用 /api/admin/seckill/** 整段导流会把它们一起抢走。
        - id: flash-sale-activity
          uri: lb://flash-sale-activity
          predicates:
            - Path=/api/admin/seckill/activities,/api/admin/seckill/activities/*/preheat,/api/admin/seckill/activities/*/reset-stock
        # P4 Day 2：seckill 域已服务化（flash-sale-seckill :8086）。
        # 同一前缀下还混着 order 域的 /api/seckill/orders/*、/api/seckill/users/*/orders ——
        # 用 /api/seckill/** 整段导流会把订单查询一起抢走，所以只列 seckill 自己的四条：
        # 活动列表 / 详情（公开读）、可秒杀校验 / 执行（需登录，由 auth-core 在服务侧再校一次）。
        - id: flash-sale-seckill
          uri: lb://flash-sale-seckill
          predicates:
            - Path=/api/seckill/activities,/api/seckill/activities/*,/api/seckill/activities/*/check,/api/seckill/execute
        # P4 Day 3：order 域已服务化（flash-sale-order :8087）。
        # 它的路径与 seckill 域**共用 /api/seckill 前缀**，所以只能用精确 Path 切开：
        # 订单三个查询（都要登录，服务侧 auth-core 再校一次）+ 死信回放（/api/admin/** 走管理护栏）。
        - id: flash-sale-order
          uri: lb://flash-sale-order
          predicates:
            # P4 Day 10：快照落库端点按守卫归属搬到 order 应用（权威库 flash_sale_order 是它），
            # 所以这里补一条**精确** Path —— 不加会落到 monolith 的 /api/** 兜底上（先匹配先赢）。
            # 联调整改：补 replay-batch（死信批量重放，处理器同样只在 order 的 AdminMessageController；
            # 旧配置只登记了单条 /replay，批量路径会掉到单体兜底 → 单体不扫 order 包 → 404）。
            - Path=/api/seckill/orders/*,/api/seckill/users/*/orders,/api/seckill/users/me/orders,/api/admin/seckill/dead-letters/replay,/api/admin/seckill/dead-letters/replay-batch,/api/admin/seckill/activities/*/snapshot
        # 单体（P0 模块化单体）已注册为 flash-sale-monolith；
        # lb:// 走服务发现 + 客户端负载均衡（多实例时自动轮询），不再写死 IP:端口
        - id: flash-sale-monolith
          uri: lb://flash-sale-monolith
          predicates:
            - Path=/api/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true

# =====================================================
# 统一鉴权（P2 Day 4）：管理令牌 / 用户态凭证的准入校验
# 服务侧拦截器保留为纵深防御（直连服务仍受保护）
# =====================================================
security:
  # 与单体/各服务同源：由 .env 的 ADMIN_TOKEN 注入。
  # 注意：网关必须以聚合根为工作目录运行（boot 插件 workingDirectory），否则读不到 .env，
  # 会导致所有 /api/admin/** 请求被判 40100「管理端访问令牌未配置」。
  admin-token: ${ADMIN_TOKEN:}

gateway:
  auth:
    # 用户态准入使用的会话 Cookie 名（与单体 / auth 服务一致）
    session-cookie-name: ${SESSION_COOKIE_NAME:FLASH_SESSION}

# =====================================================
# 健康与指标（P1-2：Prometheus 抓取 /actuator/prometheus）
# =====================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ghb.ecommerceflashsalesystem: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
