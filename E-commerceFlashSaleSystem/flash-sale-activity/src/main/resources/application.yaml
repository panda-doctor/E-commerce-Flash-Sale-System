# =====================================================
# 活动服务（flash-sale-activity）—— P3 Day 4：activity 域服务化
# 端口 8085；服务名 flash-sale-activity
# 过渡期：① 读路径仍指 flash_sale 库（Day 5 切换）；② 写路径双写到 flash_sale_activity（Day 3 开关）
# =====================================================
server:
  port: ${ACTIVITY_PORT:8085}

spring:
  application:
    name: flash-sale-activity
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    # P4 Day 1「切读」：新 schema 是**唯一权威源** —— 读 + 写都在这（旧库降级为副本，见文末镜像段）
    url: jdbc:mysql://localhost:3306/flash_sale_activity?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
  data:
    # 必须与单体同一个 Redis 库：预热写入的 seckill:activity:* / seckill:stock:* 要与单体
    # 的秒杀执行/校验路径共用（否则预热在本服务写、执行读不到）
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 5000ms

# ===== 以下两段与单体/商品应用一字不差：product-core 的存储 Bean（本地/OSS 二选一）需要它们
#      才能初始化；活动服务本身不使用上传功能 =====
aliyun:
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:panda-tea}
    domain: ${OSS_DOMAIN:https://panda-tea.oss-cn-beijing.aliyuncs.com}

storage:
  local:
    dir: uploads

# ===== 安全（P3 Day 5）=====
security:
  # /api/admin/** 服务侧纵深防御（infra 的 AdminAccessWebConfig；未配置则管理端一律 40100）
  admin-token: ${ADMIN_TOKEN:}

module:
  # 内部接口令牌（X-Internal-Token）：服务间调用（本服务 → 单体库存接口 / 商品摘要接口）使用；
  # 未配置时双方都拒绝（fail-closed）。dev 默认值仅供本地；生产必须用环境变量覆盖。
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}
  db:
    # P4 Day 1「切读」：权威 = 本应用的 datasource（flash_sale_activity）；**副本 = 旧库 flash_sale**
    # —— 未拆模块（单体 seckill 活动校验/AI 客服/analytics 快照）仍读它，所以本镜像**默认开启**
    # （Day 3 时它只是影子副本、默认关；语义已随切读反转）：关掉 = 未拆模块读到凝固的旧副本。
    dual-write:
      enabled: ${DUAL_WRITE_ENABLED:false}
      legacy-product-url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      legacy-activity-url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: ${MYSQL_PASSWORD:123456}

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml      # XML 在 activity-core jar 里，必须 classpath*
  type-aliases-package: com.ghb.ecommerceflashsalesystem.domain.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: INPUT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ghb.ecommerceflashsalesystem: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
