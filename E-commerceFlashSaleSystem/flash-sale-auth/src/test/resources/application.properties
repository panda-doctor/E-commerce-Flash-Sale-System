# 测试侧关闭 Nacos 注册（与 bootstrap / ai 模块测试同款）：
# ① 避免 Nacos 未启动时拖慢/报错；② 避免测试实例污染 Nacos 服务列表。
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.discovery.register-enabled=false

# =====================================================
# P4 Day 5：测试数据源隔离 —— 集成测试一律打独立测试库
# =====================================================
# 本模块的 AuthRegisterIntegrationTest 会真的注册用户（旧版直连业务库，把测试账号留在
# user_account 里 —— 业务库 111 行里相当一部分就是这么来的）。测试库快照由
# scripts/create-test-db.ps1 生成。
spring.datasource.url=jdbc:mysql://localhost:3306/flash_sale_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true

# P4 Day 6：测试**不开反向镜像**。
# 为什么必须关：镜像目标 legacy-auth-url 是硬编码的**旧库**（不随 datasource 走），
# 测试若开着，注册用例会把测试账号镜像进业务库 —— 正是 Day 5 花一天消灭的那类污染。
# 测试不是副本的维护者：副本保鲜是 auth 应用（生产）的职责。
module.db.dual-write.enabled=false

# P4 Day 7：测试上下文同样要 db 模式 —— 否则账号/会话写服务（@ConditionalOnProperty db）
# 不会实例化，注册/登录用例直接拿不到 Bean；本地校验适配器也要跟着生效。
module.auth.mode=db
