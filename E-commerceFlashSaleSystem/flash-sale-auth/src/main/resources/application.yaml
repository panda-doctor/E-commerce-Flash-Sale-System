# =====================================================
# 认证服务（flash-sale-auth）—— P2 边缘抽取
#
# 端口 8082；服务名 flash-sale-auth（Nacos 服务发现名，网关 lb:// 目标）。
# 过渡期说明（Day 1）：
#   ① 数据库仍共用 flash_sale schema（P3 阶段再做 schema 隔离与双写迁移）；
#   ② 网关尚未路由到本服务，因此线上行为与单体时期完全一致（回退点：停掉本服务即可）；
#   ③ 鉴权拦截器（ApiAccessInterceptor）暂未纳入本服务，Day 4 由网关统一鉴权承接。
# =====================================================
server:
  port: ${AUTH_PORT:8082}
  forward-headers-strategy: framework

spring:
  application:
    name: flash-sale-auth

  # 服务注册（Nacos 2.5.4 本机 standalone，未开鉴权；8848 HTTP + 9848 客户端 gRPC）
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

  # P4 Day 6「auth 库拆分」：auth 两张表（user_account / user_session）的**权威源**是
  # flash_sale_auth（读 + 写都在这）；旧库 flash_sale 降级为**副本**，由 AuthMirror 反向镜像保鲜
  # —— 副本的读者是 monolith / seckill / order 三个运行时的会话校验（ApiAccessInterceptor）。
  # 回滚 = 把本行换回 flash_sale + 关镜像（1 分钟，数据无代价）。
  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale_auth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000

  # 会话/令牌相关缓存（与单体同库同实例；生产应按服务划分 key 前缀）
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 2000ms

# =====================================================
# P4 Day 6：auth 权威库 = 本应用 datasource（flash_sale_auth）；
# **副本 = 旧库 flash_sale**。本应用是副本的唯一维护者 → **默认开启**；
# 关掉 = 另外三个运行时（monolith / seckill / order）的会话校验会读到凝固的副本。
# 单体与其它应用不配这一段（它们没有 auth 写路径）。
# =====================================================
module:
  # P4 Day 7：本应用现在**服务**内部接口 /internal/auth/sessions/validate，
  # 由 infra 的 InternalAccessWebConfig 用 X-Internal-Token 守护（fail-closed）——
  # 调用方（monolith / order / seckill）必须配同一个值。
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}
  auth:
    # P4 Day 7：本应用是 auth 权威 → 会话校验走**本地查库**实现（LocalSessionValidationAdapter）
    # 且实例化账号/会话写服务；其余运行时（monolith / seckill / order）不配此项 = 默认 remote，
    # 走 POST /internal/auth/sessions/validate。
    mode: db
  db:
    dual-write:
      enabled: ${DUAL_WRITE_ENABLED:false}
      legacy-auth-url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: ${MYSQL_PASSWORD:123456}

# 鉴权与令牌配置（与单体保持一致，环境变量驱动）
security:
  admin-token: ${ADMIN_TOKEN:}
  user-tokens: ${USER_TOKENS:}
  legacy-user-tokens-enabled: ${LEGACY_USER_TOKENS_ENABLED:false}
  session-cookie-name: ${SESSION_COOKIE_NAME:FLASH_SESSION}
  session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
  session-ttl-hours: ${SESSION_TTL_HOURS:168}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

mybatis-plus:
  # 多模块后 XML 分散在各模块 jar，必须用 classpath* 通配扫描
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.ghb.ecommerceflashsalesystem.domain.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: INPUT

# =====================================================
# P2 可观测：Actuator 健康与指标（Prometheus 抓取 /actuator/prometheus）
# =====================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ghb.ecommerceflashsalesystem: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
