# =====================================================
# 商品服务（flash-sale-product）—— P3 Day 1 服务化骨架
# 端口 8084；服务名 flash-sale-product
# 过渡期：① 共用 flash_sale 库（Day 3 做 schema 隔离）；② 对外接口仍由单体提供（Day 2 割接）
# =====================================================
server:
  port: ${PRODUCT_PORT:8084}

spring:
  application:
    name: flash-sale-product
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    # P4 Day 1「切读」：新 schema 是**唯一权威源** —— 读 + 写都在这（旧库降级为副本，见文末镜像段）
    url: jdbc:mysql://localhost:3306/flash_sale_product?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 5000ms

# ===== 以下两段必须与单体 yaml 一字不差（否则上传 URL / 落盘目录不一致）=====
aliyun:
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:panda-tea}
    domain: ${OSS_DOMAIN:https://panda-tea.oss-cn-beijing.aliyuncs.com}

storage:
  local:
    dir: uploads
# ===== 以上两段从单体 application.yaml 原样拷贝 =====

# ===== 安全（P3 Day 5）=====
security:
  # /api/admin/** 服务侧纵深防御（infra 的 AdminAccessWebConfig；未配置则管理端一律 40100）
  admin-token: ${ADMIN_TOKEN:}

module:
  # 内部接口令牌（X-Internal-Token）：服务间调用（activity → 本服务的 /internal/products/briefs）使用；
  # 未配置时双方都拒绝（fail-closed）。dev 默认值仅供本地；生产必须用环境变量覆盖。
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}
  db:
    # P4 Day 1「切读」：权威 = 本应用的 datasource（flash_sale_product）；
    # **副本 = 旧库 flash_sale** —— 未拆模块（seckill / ai / analytics 仍在单体）仍读它，
    # 所以本镜像**默认开启**（Day 3 时它只是影子副本、默认关；语义已随切读反转）：
    #   关掉 = 未拆模块会读到"凝固的旧副本"。
    dual-write:
      # P4 收官：镜像类已删除 → 本段为历史遗留（无对应配置类，Spring 忽略）
      legacy-product-url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      legacy-activity-url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: ${MYSQL_PASSWORD:123456}

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml      # XML 在 core jar 里，必须 classpath*
  type-aliases-package: com.ghb.ecommerceflashsalesystem.domain.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: INPUT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ghb.ecommerceflashsalesystem: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"